name: Visualizer CI
on:
  push:
    branches: [main]
    paths:
      - 'visualizer/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'visualizer/**'
      - '.github/workflows/ci.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    concurrency:
      # Use the same group for push and pull_request to avoid duplicate jobs
      group: viz-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: visualizer
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: visualizer/package.json
      - run: npm install
      - run: npx playwright install --with-deps
      - run: npm run build
      - run: npm run test
      - run: npm run test:e2e
