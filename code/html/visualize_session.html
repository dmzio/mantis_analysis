<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Local MantisX Session Visualizer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --bg: #1e1e1e;
      --ring: #662222;
      --cross: #444;
      --trace-hold: #4aa3ff;   /* blue – hold phase */
      --trace-trigger: #ff3366;/* red  – trigger & recoil */
      --marker-pull: #ffeb3b;  /* yellow dot */
      --marker-shot: #ffffff;  /* white X  */
    }
    body{
      margin:0; font-family:system-ui, sans-serif; background:var(--bg); color:#ddd;
      display:flex; flex-direction:column; align-items:center; min-height:100vh; gap:1rem;
    }
    header{font-size:clamp(1.2rem, 2vw, 2rem); letter-spacing:.05em; margin-top:1rem; text-align:center;}
    #dropzone{
      border:2px dashed #666; border-radius:1rem; padding:2rem 4rem; cursor:pointer; transition:.3s all;
    }
    #dropzone.hover{background:#333; border-color:#999;}
    #canvas-wrap{position:relative; width:min(90vmin,600px); aspect-ratio:1;}
    svg{width:100%; height:100%; display:block; background:var(--bg); border-radius:.5rem;}
    #controls{display:flex; flex-direction:column; align-items:center; gap:.5rem; width:min(90vmin,600px);}
    input[type=range]{width:100%; cursor:pointer;}
    select{padding:.3rem .5rem; background:#222; color:#eee; border:1px solid #555; border-radius:.3rem;}
    .label-row{display:flex; justify-content:space-between; width:100%; font-size:.9rem; color:#aaa;}
  </style>
</head>
<body>
  <header>MantisX Session&nbsp;Visualizer (offline)</header>

  <div id="dropzone">Drop a <code>.json</code> session file here or click to select</div>
  <input type="file" id="file-input" accept="application/json" style="display:none" />

  <div id="controls" style="display:none">
    <div class="label-row"><span>Shot:</span><span id="shot-num">–</span></div>
    <input type="range" id="shot-slider" min="0" max="0" value="0" step="1" />
    <div class="label-row"><span>Speed:</span><span id="speed-val">1×</span></div>
    <input type="range" id="speed-slider" min="0.25" max="3" value="1" step="0.25" />
    <select id="scale-select">
      <option value="auto">Auto Scale</option>
      <option value="fixed">Fixed Scale (10&nbsp;ring)</option>
    </select>
  </div>

  <div id="canvas-wrap"></div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('file-input');
const controls = document.getElementById('controls');
const shotSlider = document.getElementById('shot-slider');
const speedSlider = document.getElementById('speed-slider');
const speedVal = document.getElementById('speed-val');
const shotNum   = document.getElementById('shot-num');
const scaleSelect = document.getElementById('scale-select');
let session, shots=[], current=0;

/**
 * Utility – convert raw absolute pitch/yaw arrays to relative XY coordinates
 * matching Mantis web logic:
 *   – origin is the device attitude at *hold_index* (steady‑aim) so trace is centred.
 *   – X  = relative yaw, Y = -relative pitch (so upward on target is +Y)
 */
function toRelativeCoords(shot){
  const {pitch,yaw,hold_index,shot_index} = shot;
  const basePitch = pitch[hold_index] ?? pitch[0];
  const baseYaw   = yaw[hold_index]   ?? yaw[0];
  const relPitch  = pitch.map(p=>p-basePitch);
  const relYaw    = yaw.map(y=>y-baseYaw);
  return relPitch.map((p,i)=>[ relYaw[i], -p ]); // [x,y]
}

function drawCanvas(){
  d3.select('#canvas-wrap').html('');
  const size = document.getElementById('canvas-wrap').clientWidth;
  const svg = d3.select('#canvas-wrap').append('svg');
  const g = svg.append('g').attr('transform',`translate(${size/2},${size/2})`);

  // rings (ISSF target: 5 visible rings inside 10‑ring)
  const rings = d3.range(1,6).map(i=> (i/5)*(size/2));
  g.selectAll('circle.ring').data(rings).enter().append('circle')
    .attr('class','ring').attr('r',d=>d)
    .attr('fill','none').attr('stroke','var(--ring)').attr('stroke-width',1);
  // cross hairs
  g.append('line').attr('x1',-size/2).attr('x2',size/2).attr('y1',0).attr('y2',0).attr('stroke','var(--cross)').attr('stroke-width',1);
  g.append('line').attr('y1',-size/2).attr('y2',size/2).attr('x1',0).attr('x2',0).attr('stroke','var(--cross)').attr('stroke-width',1);

  const holdPathGrp    = g.append('g').attr('id','trace-hold');
  const triggerPathGrp = g.append('g').attr('id','trace-trigger');
  const pullDot  = g.append('circle').attr('r',4).attr('fill','var(--marker-pull)').attr('opacity',0);
  const shotMark = g.append('text').attr('fill','var(--marker-shot)').attr('font-size',14).attr('text-anchor','middle').attr('dominant-baseline','middle').attr('opacity',0).text('✕');

  // scale creator (shared for x & y)
  function makeScale(coords){
    if(scaleSelect.value==='fixed'){
      const maxDeg = 10; // ±10° -> edge
      return v => (v/maxDeg)*(size/2);
    }
    const extent = d3.extent(coords.map(Math.abs));
    const k = (size/2)/(extent[1] || 1e-3);
    return v => v*k;
  }

  function animateShot(idx){
    const shot = shots[idx];
    if(!shot){return;}
    shotNum.textContent=`${idx+1} / ${shots.length}`;

    const coords = toRelativeCoords(shot);
    const scale = makeScale(coords.flat());
    const scaled = coords.map(([x,y])=>[ scale(x), scale(y) ]);

    // split into phases based on stored indices
    const holdEnd   = shot.hold_index ?? 0;
    const triggerEnd= shot.pull_index ?? holdEnd;
    const shotIdx   = shot.shot_index ?? scaled.length-1;

    const pathHold    = scaled.slice(0, triggerEnd+1);
    const pathTrigger = scaled.slice(triggerEnd, shotIdx+1);

    // clear previous
    holdPathGrp.selectAll('*').remove();
    triggerPathGrp.selectAll('*').remove();
    pullDot.attr('opacity',0);
    shotMark.attr('opacity',0);

    const line = d3.line().curve(d3.curveBasis);

    // draw & animate hold path (blue)
    const holdPath = holdPathGrp.append('path')
      .attr('d',line(pathHold))
      .attr('fill','none')
      .attr('stroke','var(--trace-hold)')
      .attr('stroke-width',2)
      .attr('stroke-dasharray',function(){return this.getTotalLength();})
      .attr('stroke-dashoffset',function(){return this.getTotalLength();});

    // after hold anim completes, animate trigger / recoil path
    const triggerPath = triggerPathGrp.append('path')
      .attr('d',line(pathTrigger))
      .attr('fill','none')
      .attr('stroke','var(--trace-trigger)')
      .attr('stroke-width',2)
      .attr('stroke-dasharray',function(){return this.getTotalLength();})
      .attr('stroke-dashoffset',function(){return this.getTotalLength();});

    const totalDur = 3000/speedSlider.value;
    const holdDur  = totalDur* (pathHold.length / scaled.length);
    const trigDur  = totalDur - holdDur;

    holdPath.transition()
      .duration(holdDur)
      .ease(d3.easeLinear)
      .attr('stroke-dashoffset',0)
      .on('end',()=>{
          // pull marker (yellow) at trigger break
          const [px,py] = scaled[triggerEnd];
          pullDot.attr('cx',px).attr('cy',py).attr('opacity',1);

          triggerPath.transition()
            .duration(trigDur)
            .ease(d3.easeLinear)
            .attr('stroke-dashoffset',0)
            .on('end',()=>{
              const [sx,sy] = scaled[shotIdx];
              shotMark.attr('x',sx).attr('y',sy).attr('opacity',1);
            });
      });
  }

  // --- UI bindings ---
  shotSlider.oninput = e=>{current=+e.target.value; animateShot(current);};
  speedSlider.oninput = e=>{speedVal.textContent=e.target.value+'×'; animateShot(current);};
  scaleSelect.onchange = ()=>animateShot(current);

  animateShot(0);
}

function loadSession(obj){
  session = obj.session||obj;
  shots = session.shots||[];
  if(!shots.length){alert('No shots found in JSON'); return;}
  controls.style.display='flex';
  shotSlider.max = shots.length-1;
  shotSlider.value = 0;
  speedSlider.value = 1;
  speedVal.textContent='1×';
  drawCanvas();
}

function readFile(file){
  if(!file){return;}
  const reader = new FileReader();
  reader.onload = e=>{
    try{ loadSession(JSON.parse(e.target.result)); }
    catch(err){ alert('Invalid JSON file'); console.error(err);} };
  reader.readAsText(file);
}

// drag‑and‑drop + click‑to‑select wires
['dragenter','dragover'].forEach(ev=>dropzone.addEventListener(ev,e=>{e.preventDefault(); dropzone.classList.add('hover');}));
['dragleave','drop'].forEach(ev=>dropzone.addEventListener(ev,e=>{e.preventDefault(); dropzone.classList.remove('hover');}));

dropzone.addEventListener('drop',e=>readFile(e.dataTransfer.files[0]));
dropzone.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',e=>readFile(e.target.files[0]));
</script>
</body>
</html>
