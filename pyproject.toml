[project]
name = "mantis-analytics"
version = "0.1.0"
description = "Mantis data deep analytics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11.4",
    "requests>=2.32.3",
    "ruff>=0.11.9",
]


[tool.ruff]
line-length = 110
indent-width = 4
target-version = "py312"
extend-include = ["*.ipynb"]
cache-dir = "/tmp/ruff_cache"

[tool.ruff.lint]
ignore = ["E203"]
extend-select = ["I"]

[tool.mypy]
ignore_missing_imports = true
strict_optional = true
no_implicit_optional = true
show_error_codes = true
