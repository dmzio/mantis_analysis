<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Deep Mantis icon</title>
  <desc id="desc">A teal motion trace ending in a target dot.</desc>

  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#0B1A2E"/>
      <stop offset="58%" stop-color="#071221"/>
      <stop offset="100%" stop-color="#03070D"/>
    </radialGradient>

    <linearGradient id="traceGradient" x1="120" y1="580" x2="890" y2="550" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="55%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.18 0 0 0 0 0.95 0 0 0 0 0.82 0 0 0 0.45 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="112" fill="url(#bg)"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <path
      d="M 120 592
         C 250 632, 374 506, 464 388
         C 566 254, 736 284, 748 452
         C 756 550, 812 566, 880 566"
      stroke="url(#traceGradient)"
      stroke-width="38"/>

    <circle cx="880" cy="566" r="88" stroke="#5EEAD4" stroke-width="13"/>
    <circle cx="880" cy="566" r="40" fill="#5EEAD4" stroke="none"/>
  </g>
</svg>
